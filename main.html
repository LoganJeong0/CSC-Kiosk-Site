<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CSC Kiosk Test</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <!-- Main Container representing the screen -->
    <div class="kiosk-container">
        
        <!-- Example Header Area -->
        <header class="kiosk-header">
            <h1>Welcome to the SBU Simulation Center</h1>
        </header>

        <div class="image-band">
        <img src="images\KioskIMG.jpg" alt="Simulation center">
        </div>


        <!-- Example Touch Button Navigation Sidebar/Footer -->
        <nav class="kiosk-nav">
            <button class="touch-btn" onclick = "location.href='events.html'">Today's Events</button>
            <button class="touch-btn" onclick = "location.href='map.html'">Map</button>
        </nav>

    </div>

</body>
</html>
