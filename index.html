<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CSC Kiosk</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header class="kiosk-header">
        <img src="images\CSC White Circle Logo.png">
        <h1>CLINICAL SIMULATION CENTER</h1>
        <!-- <img src="images\SBM-horz_white1.png"> -->
    </header>


    <!-- ===================== HOME SCREEN ===================== -->
    <!-- Always shown underneath the other screens so the video never stops -->
    <section id="home" class="screen active">
        <div class="kiosk-container">

            <section class="video-section">
                <video autoplay muted loop playsinline>
                <source src="images\AQPu6FZ8yIxMGXTDwEe6HPY9v9bV1iGiOp0j0AmhBYY5WGVTtpELJNSE3a1eEw1xoAZ7aQui-_BMU3gp58RRsXuMObi0Z-fQvWxaOuOdrXFfeg.mp4" type="video/mp4">
                </video>

                <div class="video-text-overlay">
                    <h1>WELCOME TO THE CLINICAL SIMULATION CENTER</h1>
                    <h2>
                        <div id="date"></div>
                        <div id="time"></div>
                    </h2>
                </div>

                <div class="buttonBox">
                    <nav class="overlay">
                        <button class="touch-btn" onclick="showScreen('events')">Today's Events</button>
                        <button class="touch-btn" onclick="showScreen('map')">Map</button>
                    </nav>
                </div>
            </section>

        </div>
    </section>


    <!-- ===================== EVENTS SCREEN ===================== -->
    <section id="events" class="screen">
        <div class="events-container">

            <div class="scroll-box">
                <div class="events-subcontainer" id="event-list">

                    <!-- EVENTS START HERE---------------------------------------------------------------------------------------------- -->
                    <!-- <h2>                                                    
                    <span>→</span>
                    </h2>
                    <p> <b>Room</b></p>
                    <br>
                    <hr> -->


                    <!-- [To hardcode events] YOU CAN COPY PASTE THE 5 (grayed out) LINES BELOW AND HIT ctrl + / TO UNCOMMENT THE CODE TO ADD MORE EVENTS. INLCLUDE <br>; <hr>; <br> (last 3 lines at the bottom) IF ItS THE LAST ENTRY  -->

                    <!--
                    (START, DO NOT COPY THIS)

                    <h2>
                    <b>[EVENT TITLE]</b>
                    <span>[ARROWS: copy and paste: ← ↑ → ↓]</span>
                    </h2>
                    <p> <b>[ROOM]</b></p>
                    <br>
                    <hr>

                    (END, DO NOT COPY THIS)

                    NOTE: If youre making the last entry on the page, you do not need to have the last 2 lines <br>, <hr>
                    -->

                    <!-- EVENTS END HERE---------------------------------------------------------------------------------------------- -->

                </div>
            </div>

            <nav class="kiosk-nav">
                <button class="touch-btn" onclick="showScreen('home')">Return to Home</button>
                <button class="touch-btn" onclick="showScreen('map')">Go to Map</button>
            </nav>

        </div>
    </section>


    <!-- ===================== MAP SCREEN ===================== -->
    <section id="map" class="screen">
        <div class="body-container">

            <div class="image-container">
                <div class="image-box">
                <img src="images\CSC Map 2025 - V1.png" alt="Simulation center Map">
                </div>
            </div>

            <nav class="kiosk-nav">
                <button class="touch-btn" onclick="showScreen('home')">Return to Home</button>
                <button class="touch-btn" onclick="showScreen('events')">Today's Events</button>
            </nav>

        </div>
    </section>


    <script>
      // Switches screens without loading a new page. Home is never hidden,
      // the other screens just cover it.
      function showScreen(name) {
        // Start the events list at the top for each new visitor
        if (name === 'events') {
          document.querySelector('#events .scroll-box').scrollTop = 0;
        }
        document.querySelectorAll('.screen').forEach((screen) => {
          screen.classList.toggle('active', screen.id === name);
        });
        // Blur home whenever another screen is covering it
        document.getElementById('home').classList.toggle('blurred', name !== 'home');


        const video = document.querySelector('#home video');
        if (name === 'home') {
          const playing = video.play();
          if (playing && playing.catch) playing.catch(() => {});   // older WebViews don't return a promise
        } else {
          video.pause();
        }
      }
    </script>

    <script src="UIelements.js"></script>
    <script src="mapzoom.js"></script>
    <script src="main.js"></script>
</body>
</html>
